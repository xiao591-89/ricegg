<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你的服务器名称 - Minecraft 服务器</title>
  <meta name="description" content="1.21.11 Fabric 原版生存服" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="server-name">你的服务器名称</h1>
    <p id="server-desc">原版生存 · 长期存档 · 不换周目</p>
  </header>

  <main>
    <section>
      <h2>服务器信息</h2>
      <ul>
        <li>版本：<span id="server-version">1.21.11 Fabric</span></li>
        <li>地址：<span id="server-ip">play.yourserver.net</span></li>
        <li>QQ 群：<span id="server-qq">123456789</span></li>
      </ul>
      <button id="copy-btn">复制服务器地址</button>
      <span id="copy-msg"></span>
    </section>

    <section>
      <h2>加入方式</h2>
      <p>启动 Minecraft 1.21.11 Fabric 客户端，添加服务器地址即可加入。</p>
      <p>加入 QQ 群获取最新公告和帮助。</p>
    </section>

    <section>
      <h2>服务器规则</h2>
      <ul>
        <li>禁止作弊、外挂、恶意破坏</li>
        <li>尊重其他玩家，友好交流</li>
        <li>禁止未经允许的 PVP</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>你的服务器名称 · 基于 HTML/CSS/JS 构建</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
